<!-- ============================================================
     PROMPT VAULT — Ink & Brass single-file tool
     Offline-first. No web fonts, no CDNs, no build step. Works from file://.
     Stores text-to-image prompts with an optional reference image (client-side
     resized + JPEG-compressed before storage), free-form tags, a notes/comments
     field, and a copy-to-clipboard button.
     Prompts flagged Protected are AES-GCM encrypted in place (key derived from a
     PIN via PBKDF2-SHA256). The PIN unlocks all Protected prompts for the browser
     session; nothing about a locked prompt's content — text, tags, comments,
     image — is ever written to storage in the clear.
     v4.0 removed the prompt Generator (tag categories, master groups, presets and the
     builder). Any db.categories / db.groups / db.presets already saved are left
     untouched in storage and in backups rather than deleted, so the removal is
     reversible — nothing you generated is destroyed by upgrading.
     Persists to localStorage; gzip-compressed JSON export/import is the backup.
     Encrypted prompts stay encrypted inside the backup file too.
     ============================================================ -->

<style>
:root{
  --ink:#16202B;--ink-2:#243240;
  --paper:#EAEEF2;--surface:#FFFFFF;--surface-2:#F6F8FA;
  --muted:#5A6675;--faint:#8A95A3;
  --line:#D8DFE6;--line-2:#E7ECF1;
  --brass:#A8772C;--brass-hi:#C8943A;--brass-soft:#F3EAD8;
  --gain:#1B7A4B;--gain-soft:#E4F1EA;--loss:#B5403A;--loss-soft:#F6E6E5;
  --warn:#8A6414;--warn-soft:#F2E7CC;
  --r:7px;--r-lg:11px;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 6px 20px rgba(22,32,43,.05);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  --eyebrow-size:13px;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);
  background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:var(--brass)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#C9D3DD;padding:20px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:6px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin:-16px 0 14px -14px}
.brand .seal{width:56px;height:56px;flex:none;display:block}
.brand b{color:#fff;font-size:14px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;color:var(--faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#AEBAC6;padding:9px 11px;border-radius:var(--r);font-size:13.5px;text-align:left;cursor:pointer;width:100%}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:rgba(200,148,58,.14);color:#fff}
.nav button.on .ic{color:var(--brass-hi)}
.nav .ic{width:17px;height:17px;color:#8595A4;flex:none}
.railver{font-size:10.5px;color:var(--faint);letter-spacing:.04em;padding:12px 8px 0;margin-top:auto}
.railver b{color:#9FB0C0;font-weight:600}
.main{padding:26px 30px 60px;max-width:1180px}

/* ---- type / page header ---- */
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.eyebrow{font-size:var(--eyebrow-size);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:7px}
h1{margin:0;font-size:22px;font-weight:680;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}

/* ---- grids ---- */
.grid{display:grid;gap:16px}
.cols-1{grid-template-columns:1fr}
.cols-2{grid-template-columns:1fr 1fr}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line)}
.cardhead h3{margin:0;font-size:14px;font-weight:650}
.cardhead .hint{font-size:12px;color:var(--faint)}
.pad{padding:16px 17px}

/* ---- pills / buttons / chips ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.nsfw{background:var(--warn-soft);color:var(--warn)}
/* key/value stat grid — same component as Prompt Forge's, so the two apps match */
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-size:13.5px;font-weight:550;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.brass{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.brass:hover{background:#946826}
.btn.ghost{background:none}
.btn.danger{color:var(--loss);border-color:var(--loss-soft)}
.btn.danger:hover{background:var(--loss-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.iconbtn{border:0;background:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:5px;font-size:15px;line-height:1}
.iconbtn:hover{background:var(--loss-soft);color:var(--loss)}
.tag{display:inline-block;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 8px;font-size:12px;color:var(--muted)}

/* ---- inputs ---- */
label.fld{display:block;font-size:12px;color:var(--muted);font-weight:550;margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink)}
.cardcat{width:auto;max-width:110px;padding:5px 6px;font-size:11.5px;border-radius:6px;color:var(--muted)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass-soft);border-color:var(--brass)}
.checkline{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.checkline input[type=checkbox]{width:auto}

/* ---- library ---- */
.searchrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.libheader{position:sticky;top:0;z-index:5;background:var(--paper);padding-top:26px;margin-top:-26px;padding-bottom:2px;margin-bottom:4px}
.searchrow input{flex:1;min-width:180px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.promptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.grouphead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--line-2)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.pcard.locked{border-style:dashed;background:var(--surface-2);box-shadow:none}
.pcard .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-2)}
.pcard .thumb-empty{width:100%;aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
.pcard .body{padding:12px 13px;flex:1;display:flex;flex-direction:column;gap:8px}
.pcard.locked .body{align-items:center;text-align:center;justify-content:center}
.pcard .ptext{font-size:13px;color:var(--ink);line-height:1.4;max-height:4.2em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pcard .pcomments{font-size:12px;color:var(--muted);line-height:1.35;max-height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .pseed{font-size:11px;color:var(--faint)}
.pcard .pseed code{font-family:var(--mono);color:var(--muted)}
.pcard .tagrow{display:flex;flex-wrap:wrap;gap:5px}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-top:1px solid var(--line-2)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.rowlabel{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.catmgmt{margin-top:6px}
.rollup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.rollup-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;cursor:pointer}
.rollup-head:hover{background:var(--surface-2)}
.rollup-head .rtitle{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14.5px}
.rollup-head .rcount{font-size:12px;color:var(--faint);font-weight:500;margin-left:2px}
.rollup-chevron{color:var(--faint);transition:transform .15s;flex:none}
.rollup.open .rollup-chevron{transform:rotate(90deg)}
.rollup-body{padding:0 16px 16px}
.rollup-actions{display:flex;gap:2px}
.drag-handle{color:var(--faint);cursor:grab;display:flex;align-items:center;flex:none}
.drag-handle:active{cursor:grabbing}
.drag-handle-spacer{display:inline-block;width:13px;flex:none}
.rollup.dragging{opacity:.45}
.rollup.drag-over{outline:2px dashed var(--brass);outline-offset:-2px}

/* ---- lock status (rail) ---- */
.lockbox{padding:10px 8px;border-top:1px solid rgba(255,255,255,.08);margin-top:10px}
.lockbox .st{font-size:11.5px;color:var(--faint);margin-bottom:6px}
.lockbox button{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:7px;border-radius:6px;font-size:12.5px;cursor:pointer}
.lockbox button:hover{background:rgba(255,255,255,.12)}

/* ---- toast / modal ---- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:9px;z-index:60;pointer-events:none;transition:.18s}
/* Persistent, dismiss-proof banner for a failed write. Deliberately not a toast:
   a toast is transient and self-overwriting, which is exactly how a silent data
   loss went unnoticed before v3.16. Stays up until a save actually succeeds. */
.savealert{position:fixed;left:0;right:0;top:0;z-index:120;background:var(--loss);color:#fff;
  padding:10px 18px;font-size:13px;font-weight:600;line-height:1.4;text-align:center;
  box-shadow:0 2px 12px rgba(22,32,43,.3)}
.savealert[hidden]{display:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brass-hi)}
.scrim{position:fixed;inset:0;background:rgba(16,22,30,.45);display:grid;place-items:center;z-index:50;padding:20px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(480px,96vw);box-shadow:0 20px 60px rgba(16,22,30,.3);padding:20px 22px;margin:auto}
.modal.wide{width:min(600px,96vw)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal .mh h3{margin:0;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.imgprev{max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(22,32,43,.55);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-nav:hover{background:rgba(22,32,43,.8)}
.lightbox-nav.left{left:8px}
.lightbox-nav.right{right:8px}

/* ---- responsive: rail -> horizontal top bar (same markup, CSS transform only) ---- */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;overflow-y:visible;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:6px}
  .brand,.railver,.lockbox{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{width:auto;white-space:nowrap}
  .main{padding:18px 16px 50px}
  .cols-2{grid-template-columns:1fr}
  .libheader{position:static;margin-top:0;padding-top:0}
}
</style>
</head>

<div id="savealert" class="savealert" hidden></div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================ constants ============================ */
const APP_VERSION='4.2', APP_BUILD='2026-09-13';
const LS_KEY='inkbrass.promptvault.v1';
const SEED=JSON.parse(document.getElementById('seed').textContent);
const MAX_IMG_DIM=640;     // longest edge, px — reference thumbnail, not a full-res copy
const IMG_QUALITY=0.82;    // JPEG quality 0-1
const PBKDF2_ITERATIONS=150000;
const PIN_MAGIC='PROMPTVAULT-PIN-OK-v1';
const IDB_NAME='inkbrass.promptvault.images', IDB_STORE='images', IDB_VERSION=1;
const BACKUP_VERSION=2;   // 2 = images in a top-level `images` map; 1 = images inline on each prompt
const $=(s,el=document)=>el.querySelector(s);

/* ============================ state ============================ */
let db=loadDB();
let view='library';
let state={search:'', tagFilters:[]};
let sessionKey=null;        // CryptoKey — present only while unlocked this session
let decryptedCache={};      // promptId -> {promptText,tags,comments,image}
let imageCache={};          // promptId -> {data,w,h} for UNPROTECTED prompts, loaded from IndexedDB at boot
let idb=null;               // IndexedDB handle for the image store; null = unavailable
let storageAlert=null;      // text of the persistent 'not saved' banner, or null
let modalState={id:null, image:null, nsfw:false};
let lightboxState={ids:[], index:0};
let pinAfterFn=null;
let pendingEncryptedImport=null;   // wrapper object awaiting a PIN during an encrypted-backup import

function loadDB(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const d=JSON.parse(raw); if(!Array.isArray(d.prompts)) d.prompts=[]; if(d.security===undefined) d.security=null; if(!Array.isArray(d.libCategories)) d.libCategories=[]; d.prompts.forEach(p=>{ if(p.categoryId===undefined) p.categoryId=null; }); if(!d.expandedCategories || typeof d.expandedCategories!=='object') d.expandedCategories={}; delete d.images; delete d.backupVersion; return d; }
  }catch(e){}
  return structuredClone(SEED);
}
/* saveDB MUST report whether the write actually happened. A toast is not enough:
   toast() overwrites itself, so a failure raised here used to be wiped out by the
   very next success message and the app would claim to have saved when it hadn't.
   Callers that announce success must check the return value; the banner is the
   catch-all for the many callers that don't. */
function saveDB(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(db));
    setStorageAlert(null);
    return true;
  }catch(e){
    setStorageAlert('NOT SAVED — '+((e&&e.name)||'storage error')+'. Your changes exist only in this tab and will be lost when it closes. Export a backup now.');
    return false;
  }
}
function setStorageAlert(msg){
  storageAlert=msg||null;
  const el=document.getElementById('savealert');
  if(!el) return;
  if(storageAlert){ el.textContent=storageAlert; el.hidden=false; }
  else { el.textContent=''; el.hidden=true; }
}

/* ============================ helpers ============================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayStr(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2500); }

/* ============================ crypto (AES-GCM, key from PIN via PBKDF2) ============================ */
function buf2b64(buf){
  const bytes=new Uint8Array(buf); let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function b642buf(b64){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }
async function deriveKey(pin, saltB64, iterations){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  const salt=new Uint8Array(b642buf(saltB64));
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(obj, key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
  return {iv:buf2b64(iv), ct:buf2b64(ct)};
}
async function decryptJSON(enc, key){
  const iv=new Uint8Array(b642buf(enc.iv));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b642buf(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function setupPin(pin){
  const saltB64=buf2b64(crypto.getRandomValues(new Uint8Array(16)).buffer);
  const key=await deriveKey(pin, saltB64, PBKDF2_ITERATIONS);
  const verifier=await encryptJSON({m:PIN_MAGIC}, key);
  db.security={salt:saltB64, iterations:PBKDF2_ITERATIONS, verifier};
  saveDB();
  sessionKey=key; decryptedCache={};
}
async function tryUnlock(pin){
  if(!db.security) return false;
  try{
    const key=await deriveKey(pin, db.security.salt, db.security.iterations);
    const check=await decryptJSON(db.security.verifier, key);
    if(check.m!==PIN_MAGIC) return false;
    sessionKey=key; decryptedCache={};
    let migrated=0;
    for(const p of db.prompts){
      if(!(p.nsfw && p.enc)) continue;
      let c; try{ c=await decryptJSON(p.enc, key); }catch(e){ continue; }
      if(c.image && c.image.data){
        // legacy (v3.15 and earlier): the image was encrypted inside `enc`. Move it to
        // the image store under its own ciphertext, then re-encrypt `enc` without it.
        const blob=await encryptJSON({data:c.image.data, w:c.image.w, h:c.image.h}, key);
        if(await idbPut(p.id, {enc:true, blob})){
          const rest=Object.assign({}, c); delete rest.image;
          p.enc=await encryptJSON(rest, key);
          migrated++;
        }
      } else {
        const rec=await idbGet(p.id);
        c.image=null;
        if(rec && rec.enc && rec.blob){ try{ c.image=await decryptJSON(rec.blob, key); }catch(e){ c.image=null; } }
      }
      decryptedCache[p.id]=c;
    }
    if(migrated) saveDB();
    return true;
  }catch(e){ return false; }
}
async function changePin(newPin){
  const saltB64=buf2b64(crypto.getRandomValues(new Uint8Array(16)).buffer);
  const newKey=await deriveKey(newPin, saltB64, PBKDF2_ITERATIONS);
  for(const p of db.prompts){
    if(!p.nsfw) continue;
    const c=decryptedCache[p.id]; if(!c) continue;
    const rest=Object.assign({}, c); delete rest.image;
    p.enc=await encryptJSON(rest, newKey);
    // the image sits in its own ciphertext in the image store — it needs rekeying as well
    if(c.image && c.image.data){
      await idbPut(p.id, {enc:true, blob:await encryptJSON({data:c.image.data, w:c.image.w, h:c.image.h}, newKey)});
    }
  }
  db.security={salt:saltB64, iterations:PBKDF2_ITERATIONS, verifier:await encryptJSON({m:PIN_MAGIC}, newKey)};
  sessionKey=newKey; saveDB();
}
function lockNow(){ sessionKey=null; decryptedCache={}; render(); toast('Locked'); }

/* ============================ image handling ============================ */
// Resizes/re-encodes an uploaded image client-side before it ever touches storage:
// long edge capped at MAX_IMG_DIM, re-encoded as JPEG at IMG_QUALITY. This is a
// visual cue for the stored prompt, not an archival copy of the original file.
function resizeImageFile(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>MAX_IMG_DIM || h>MAX_IMG_DIM){
        if(w>=h){ h=Math.round(h*MAX_IMG_DIM/w); w=MAX_IMG_DIM; } else { w=Math.round(w*MAX_IMG_DIM/h); h=MAX_IMG_DIM; }
      }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb({data:canvas.toDataURL('image/jpeg', IMG_QUALITY), w, h});
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ============================ image store (IndexedDB) ============================
   Reference images live in IndexedDB, NOT in localStorage. localStorage is capped at
   roughly 5MB per origin, and in Chrome every file:// page shares ONE origin — so a
   few hundred base64 thumbnails in here silently starve every other Ink & Brass tool
   as well as this one. IndexedDB on the same origin reports a quota in gigabytes.

   Record shape, keyed by prompt id:
     unprotected: {enc:false, data:<jpeg dataURL>, w, h}
     protected:   {enc:true,  blob:{iv,ct}}          // AES-GCM of {data,w,h}, PIN key

   A prompt record in localStorage no longer carries `image` at all. In memory,
   unprotected images sit in imageCache (loaded at boot) and protected ones in
   decryptedCache[id].image (populated at unlock), so cardHTML() stays synchronous.

   Storage is best-effort: navigator.storage.persist() is refused for file:// origins,
   so IndexedDB can in principle be evicted under real disk pressure while the
   localStorage metadata survives. imageFor() therefore returns null rather than
   throwing, and every render path treats a missing image as 'no image'. */
function openImageDB(){
  return new Promise(resolve=>{
    try{
      const req=indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded=()=>{ const d=req.result; if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbStore(mode){ if(!idb) return null; try{ return idb.transaction(IDB_STORE, mode).objectStore(IDB_STORE); }catch(e){ return null; } }
function idbGet(id){ return new Promise(res=>{ const st=idbStore('readonly'); if(!st) return res(null); const r=st.get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }
function idbPut(id, rec){ return new Promise(res=>{
  const st=idbStore('readwrite');
  if(!st){ setStorageAlert('Image store unavailable — reference images are not being saved.'); return res(false); }
  const r=st.put(rec, id);
  r.onsuccess=()=>res(true);
  r.onerror=()=>{ setStorageAlert('Image NOT saved — '+((r.error&&r.error.name)||'storage error')+'. Export a backup now.'); res(false); };
}); }
function idbDelete(id){ return new Promise(res=>{ const st=idbStore('readwrite'); if(!st) return res(false); const r=st.delete(id); r.onsuccess=()=>res(true); r.onerror=()=>res(false); }); }
function idbClear(){ return new Promise(res=>{ const st=idbStore('readwrite'); if(!st) return res(false); const r=st.clear(); r.onsuccess=()=>res(true); r.onerror=()=>res(false); }); }
function idbEntries(){ return new Promise(res=>{ const st=idbStore('readonly'); if(!st) return res({}); const out={}; const r=st.openCursor(); r.onsuccess=()=>{ const c=r.result; if(!c) return res(out); out[c.key]=c.value; c.continue(); }; r.onerror=()=>res(out); }); }

// The single accessor every render path uses. Never throws, never assumes presence.
function imageFor(p){
  if(!p) return null;
  if(p.nsfw){ const c=decryptedCache[p.id]; return (c&&c.image)||null; }
  return imageCache[p.id]||null;
}
async function loadImageCache(){
  imageCache={};
  const all=await idbEntries();
  for(const id in all){ const rec=all[id]; if(rec && !rec.enc && rec.data) imageCache[id]={data:rec.data, w:rec.w, h:rec.h}; }
}
/* v3.15-and-earlier data kept unprotected images inline on the prompt record. Move
   them out on first boot. If a write fails the inline copy is left exactly where it
   is — never drop the only copy of something that could not be rewritten. Protected
   prompts' images are inside `enc` and can only be migrated at unlock (see tryUnlock). */
async function migrateInlineImages(){
  let moved=0;
  for(const p of db.prompts){
    if(p.nsfw || !p.image || !p.image.data) continue;
    if(!await idbPut(p.id, {enc:false, data:p.image.data, w:p.image.w, h:p.image.h})) return false;
    delete p.image; moved++;
  }
  if(moved) saveDB();
  return true;
}

/* ============================ navigation ============================ */
const NAV=[
  ['library','Library','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z'],
  ['data','Data &amp; Security','M6 10V7a6 6 0 1112 0v3M5 10h14v10H5z']
];
function icon(d){return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;}
function go(v){ view=v; render(); window.scrollTo(0,0); }

/* ============================ render router ============================ */
function render(){
  renderNav();
  $('#main').innerHTML = view==='library' ? viewLibrary() : viewData();
  if(view==='data') refreshStoredNow();   // async: image-store figures come from IndexedDB
}
function renderNav(){
  $('#nav').innerHTML=NAV.map(([id,label,d])=>`<button class="${id===view?'on':''}" onclick="go('${id}')">${icon(d)}<span>${label}</span></button>`).join('');
  $('#railver').innerHTML=`<b>v${APP_VERSION}</b> · ${APP_BUILD}`;
  renderLockbox();
}
function renderLockbox(){
  const el=$('#lockbox'); if(!el) return;
  if(!db.security){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="lockbox"><div class="st">${sessionKey?'🔓 Unlocked':'🔒 Locked'}</div>
    <button onclick="${sessionKey?'lockNow()':'openPinUnlockModal()'}">${sessionKey?'Lock now':'Unlock'}</button></div>`;
}

/* ---------- Library ---------- */
function allTags(){
  const set=new Set();
  for(const p of db.prompts){ const c=p.nsfw?decryptedCache[p.id]:p; if(c) (c.tags||[]).forEach(t=>set.add(t)); }
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function visibleList(){
  const q=(state.search||'').trim().toLowerCase();
  const tagFilters=state.tagFilters;
  return db.prompts.filter(p=>{
    const c=p.nsfw?decryptedCache[p.id]:p;
    if(p.nsfw && !c) return !q && !tagFilters.length; // locked cards only show in the unfiltered view
    if(tagFilters.length && !tagFilters.every(t=>(c.tags||[]).includes(t))) return false;
    if(q){
      const hay=((c.promptText||'')+' '+(c.negativePrompt||'')+' '+(c.seed||'')+' '+(c.comments||'')+' '+(c.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
}
function libCountText(){
  const nsfwCount=db.prompts.filter(p=>p.nsfw).length;
  return `${db.prompts.length} prompt${db.prompts.length===1?'':'s'} saved${nsfwCount?` · ${nsfwCount} marked Protected`:''}`;
}
// Tag chips are cumulative: each click adds (or removes) that tag as an extra AND
// condition alongside the search box and any other selected chips, rather than
// swapping which single tag is active.
function chipsHTML(){
  const tagFilters=state.tagFilters;
  const tags=allTags();
  return ['<button class="chip '+(!tagFilters.length?'on':'')+'" onclick="clearTagFilters()">All</button>']
    .concat(tags.map(t=>`<button class="chip ${tagFilters.includes(t)?'on':''}" onclick="toggleTagFilter('${esc(t)}')">${esc(t)}</button>`)).join('');
}
function rollupPreviewHTML(prompts){
  const imgs=prompts.map(p=>{ const im=imageFor(p); return im?im.data:null; }).filter(Boolean).slice(0,4);
  if(!imgs.length) return '';
  return `<div style="display:flex;gap:4px">${imgs.map(src=>`<img src="${src}" style="width:26px;height:26px;object-fit:cover;border-radius:5px;border:1px solid var(--line)">`).join('')}</div>`;
}
const GRIP_ICON=`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.7"/><circle cx="16" cy="6" r="1.7"/><circle cx="8" cy="12" r="1.7"/><circle cx="16" cy="12" r="1.7"/><circle cx="8" cy="18" r="1.7"/><circle cx="16" cy="18" r="1.7"/></svg>`;
let dragCatId=null;
// Native HTML5 drag/drop: only the grip handle is draggable (not the whole card,
// so clicking the header still just expands/collapses), and only real categories
// take part — Uncategorized always sits last and isn't reorderable. The order lives
// in db.libCategories itself, so it round-trips through both backup types for free —
// no separate "position" field needed, since JSON preserves array order.
function onRollupDragStart(e, catId){
  dragCatId=catId;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain', catId);
  const el=e.target.closest('.rollup'); if(el) el.classList.add('dragging');
}
function onRollupDragEnd(){
  document.querySelectorAll('.rollup.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.rollup.drag-over').forEach(el=>el.classList.remove('drag-over'));
  dragCatId=null;
}
function onRollupDrop(e, targetCatId){
  e.preventDefault();
  const sourceCatId=dragCatId || e.dataTransfer.getData('text/plain');
  if(!sourceCatId || sourceCatId===targetCatId) return;
  const fromIdx=db.libCategories.findIndex(c=>c.id===sourceCatId);
  let toIdx=db.libCategories.findIndex(c=>c.id===targetCatId);
  if(fromIdx<0 || toIdx<0) return;
  const [moved]=db.libCategories.splice(fromIdx,1);
  if(fromIdx<toIdx) toIdx--; // target shifted left after the source was removed
  db.libCategories.splice(toIdx,0,moved);
  saveDB(); render();

// Category rollups are built from the same filtered/sorted list the old flat grid used —

function rollupsHTML(){
  const list=visibleList();
  const filtering=!!(state.search && state.search.trim()) || state.tagFilters.length>0;
  const byCat={};
  for(const p of list){ const key=p.categoryId||'__uncat__'; (byCat[key]=byCat[key]||[]).push(p); }
  let html='';
  for(const cat of db.libCategories){
    const prompts=byCat[cat.id]||[];
    if(filtering && !prompts.length) continue;
    html+=rollupCardHTML(cat.id, cat.name, prompts, filtering, false);
  }
  const uncat=byCat['__uncat__']||[];
  if(!filtering || uncat.length) html+=rollupCardHTML('__uncat__', 'Uncategorized', uncat, filtering, true);

/* ---------- Data & Security ---------- */
/* "Stored now" — a plain statement of what is actually on disk, which is the thing
   this app got wrong for a long time: it rendered from memory and never said whether
   the write landed. The localStorage figure is read back OUT of storage rather than
   computed from `db`, so it reflects what a reload would really find.
   Image-store figures need an async IndexedDB pass, so viewData() renders the row set
   with stats=null (placeholder) and refreshStoredNow() patches the container after —
   the same targeted-DOM-write pattern the search box uses. */
function fmtBytes(chars){
  if(chars==null) return '—';
  if(chars<1024) return chars+' B';
  if(chars<1024*1024) return (chars/1024).toFixed(1)+' KB';
  return (chars/(1024*1024)).toFixed(2)+' MB';
}
function storedNowHTML(stats){
  const stored=localStorage.getItem(LS_KEY);
  const metaChars=stored?stored.length:0;
  const protCount=db.prompts.filter(p=>p.nsfw).length;
  const catCount=(db.libCategories||[]).length;
  const imgCount=stats?stats.count:null, imgChars=stats?stats.bytes:null;
  return `<div class="kv" style="margin-top:10px">
    <div>Prompts</div><div class="num">${db.prompts.length}</div>
    <div>Protected</div><div class="num">${protCount}</div>
    <div>Categories</div><div class="num">${catCount}</div>
    <div>Reference images</div><div class="num">${imgCount==null?'…':imgCount}</div>
    <div>Metadata</div><div class="num">${fmtBytes(metaChars)} in localStorage</div>
    <div>Images</div><div class="num">${imgChars==null?'…':fmtBytes(imgChars)+' in IndexedDB'}</div>
    <div>Storage key</div><div class="num">${LS_KEY}</div>
    <div>Image store</div><div class="num">${idb?'available (IndexedDB)':'unavailable in this browser'}</div>
    <div>Version</div><div class="num">v${APP_VERSION} · ${APP_BUILD}</div>
  </div>`;
}
async function refreshStoredNow(){
  const all=await idbEntries();
  let count=0, bytes=0;
  for(const id in all){
    count++;
    const rec=all[id];
    bytes += (rec && rec.enc)
      ? (((rec.blob&&rec.blob.ct)||'').length + ((rec.blob&&rec.blob.iv)||'').length)
      : (((rec&&rec.data)||'').length);
  }
  const el=document.getElementById('storedNow');
  if(el) el.innerHTML=storedNowHTML({count, bytes});
}

      <label class="fld">Category (optional)</label>
      <select id="f_category">
        <option value="">— Uncategorized —</option>
        ${db.libCategories.map(c=>`<option value="${esc(c.id)}" ${categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
      <label class="fld">Tags (comma separated)</label>
      <input id="f_tags" placeholder="e.g. landscape, cinematic" list="tagsuggest" value="${esc(tagsStr)}">
      <datalist id="tagsuggest">${allTags().map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
      <label class="fld">Notes / comments</label>
      <textarea id="f_comments" rows="3" placeholder="Any notes about this prompt...">${esc(comments)}</textarea>
      <div class="checkline"><input id="f_nsfw" type="checkbox" ${nsfw?'checked':''} onchange="onModalNsfwToggle(this)"><label for="f_nsfw" style="margin:0;font-size:13px;color:var(--ink)">Mark as Protected</label></div>
      <div class="foot">
        ${id?`<button class="btn danger" style="margin-right:auto" onclick="deletePromptConfirm('${id}')">Delete</button>`:''}
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn brass" onclick="savePromptModal()">${id?'Save changes':'Add prompt'}</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>$('#f_prompt')&&$('#f_prompt').focus(),30);
}
async function savePromptModal(){
  const promptText=$('#f_prompt').value.trim();
  if(!promptText) return toast('Enter a prompt');
  const negativePrompt=$('#f_negprompt').value.trim();
  const seed=$('#f_seed').value.trim();
  const width=parseInt($('#f_width').value,10)||null;
  const height=parseInt($('#f_height').value,10)||null;
  const tags=$('#f_tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const comments=$('#f_comments').value.trim();
  const nsfw=$('#f_nsfw').checked;
  const image=modalState.image;
  const categoryId=$('#f_category').value || null;
  if(nsfw && !sessionKey) return toast('Unlock protection first');
  const now=new Date().toISOString();
  const isEdit=!!modalState.id;
  const contentObj={promptText, negativePrompt, seed, width, height, tags, comments, image};
  const meta=Object.assign({}, contentObj); delete meta.image;   // what goes to localStorage / `enc`
  let p=modalState.id ? db.prompts.find(x=>x.id===modalState.id) : null;
  let imgOk=true;
  if(nsfw){
    const enc=await encryptJSON(meta, sessionKey);
    if(p){ p.nsfw=true; p.enc=enc; delete p.promptText; delete p.negativePrompt; delete p.seed; delete p.width; delete p.height; delete p.tags; delete p.comments; delete p.image; p.categoryId=categoryId; p.updatedAt=now; }
    else { p={id:uid(), createdAt:now, updatedAt:now, nsfw:true, enc, categoryId}; db.prompts.push(p); }
    decryptedCache[p.id]=contentObj;
    delete imageCache[p.id];
    if(image && image.data) imgOk=await idbPut(p.id, {enc:true, blob:await encryptJSON({data:image.data, w:image.w, h:image.h}, sessionKey)});
    else await idbDelete(p.id);
  } else {
    if(p){ p.nsfw=false; delete p.enc; Object.assign(p, meta); delete p.image; p.categoryId=categoryId; p.updatedAt=now; }
    else { p={id:uid(), createdAt:now, updatedAt:now, nsfw:false, categoryId, ...meta}; db.prompts.push(p); }
    delete decryptedCache[p.id];
    if(image && image.data){
      imgOk=await idbPut(p.id, {enc:false, data:image.data, w:image.w, h:image.h});
      if(imgOk) imageCache[p.id]={data:image.data, w:image.w, h:image.h};
    } else {
      await idbDelete(p.id); delete imageCache[p.id];
    }
  }
  const ok=saveDB();
  closeModal(); render();
  if(ok && imgOk) toast(isEdit?'Prompt updated':'Prompt added');
}
function deletePromptConfirm(id){
  if(!confirm('Delete this prompt? This cannot be undone.')) return;
  db.prompts=db.prompts.filter(p=>p.id!==id);
  delete decryptedCache[id]; delete imageCache[id];
  idbDelete(id);
  const ok=saveDB(); closeModal(); render();
  if(ok) toast('Prompt deleted');
}
function copyPrompt(id){
  const p=db.prompts.find(x=>x.id===id); if(!p) return;
  const content=p.nsfw?decryptedCache[p.id]:p;
  if(!content) return toast('Unlock to copy');
  navigator.clipboard.writeText(content.promptText||'').then(()=>toast('Prompt copied')).catch(()=>toast('Copy failed — clipboard blocked'));
}

/* ---------- Gzip backup compression ----------
   Backup exports can run to multiple MB of formatted JSON (mostly from embedded
   image thumbnails). Gzipping cuts that substantially using the browser's built-in
   CompressionStream/DecompressionStream (gzip) — no external library needed.
   Falls back to a plain, uncompressed .json file if unsupported. Protected prompts'
   `enc` blobs are exported as-is (still ciphertext) — the PIN is required after
   import too. */
function supportsGzipStreams(){ return typeof CompressionStream!=='undefined' && typeof DecompressionStream!=='undefined'; }
function gzipStringToBlob(str){
  const bytes=new TextEncoder().encode(str);
  const cs=new CompressionStream('gzip');
  const writer=cs.writable.getWriter();
  writer.write(bytes); writer.close();
  return new Response(cs.readable).blob();
}
function gzipStringToBytes(str){
  const bytes=new TextEncoder().encode(str);
  const cs=new CompressionStream('gzip');
  const writer=cs.writable.getWriter();
  writer.write(bytes); writer.close();
  return new Response(cs.readable).arrayBuffer().then(buf=>new Uint8Array(buf));
}
function gunzipBytesToText(bytes){
  const ds=new DecompressionStream('gzip');
  const writer=ds.writable.getWriter();
  writer.write(bytes); writer.close();
  return new Response(ds.readable).blob().then(blob=>blob.text());
}
function triggerDownload(blob, filename){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
function downloadJSONBackup(obj, filenameBase){
  const json=JSON.stringify(obj, null, 2);
  if(supportsGzipStreams()){ gzipStringToBlob(json).then(blob=>triggerDownload(blob, filenameBase+'.json.gz')); }
  else { triggerDownload(new Blob([json], {type:'application/json'}), filenameBase+'.json'); }
}
function readBackupFileAsText(file){
  return file.arrayBuffer().then(buf=>{
    const bytes=new Uint8Array(buf);
    const isGzip=bytes.length>2 && bytes[0]===0x1f && bytes[1]===0x8b;
    if(isGzip && supportsGzipStreams()){
      const ds=new DecompressionStream('gzip');
      const writer=ds.writable.getWriter();
      writer.write(bytes); writer.close();
      return new Response(ds.readable).blob().then(blob=>blob.text());
    }
    return new Blob([bytes]).text();
  });
}

/* ============================ data io ============================ */
/* Backups carry the image store in a top-level `images` map (backupVersion 2) rather
   than inline on each prompt, so a backup is still one self-contained file. Protected
   images travel as the same ciphertext they sit in locally — exactly as safe as `enc`
   already was, and no unlock needed to export. `images` is NEVER written to
   localStorage: it exists only inside a backup file. Importing a v2 backup into
   v3.15-or-earlier loses the images (that version reads them from the prompt records),
   so this is a one-way door — keep a pre-upgrade backup. */
async function buildBackupObject(){
  const images=await idbEntries();
  const out=Object.assign({}, db, {backupVersion:BACKUP_VERSION, images});
  return out;
}
async function exportJSON(){ downloadJSONBackup(await buildBackupObject(), 'promptvault-'+todayStr()); toast('Backup exported'); }

// Encrypts the ENTIRE database (not just Protected prompts) with the same PIN-derived
// key used for Protected content. The exported file is a small JSON wrapper holding
// the salt/iterations (not secret — needed to re-derive the key from the PIN on
// import) plus one AES-GCM ciphertext of the gzip-compressed database. Requires the
// vault to be unlocked (or a PIN to be created first) since the same key is reused.
async function exportEncryptedJSON(){
  if(!sessionKey){
    if(!db.security){ openPinSetupModal(()=>exportEncryptedJSON()); return; }
    openPinUnlockModal(()=>exportEncryptedJSON()); return;
  }
  const json=JSON.stringify(await buildBackupObject());
  let payloadBytes, gz;
  if(supportsGzipStreams()){ payloadBytes=await gzipStringToBytes(json); gz=true; }
  else { payloadBytes=new TextEncoder().encode(json); gz=false; }
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, sessionKey, payloadBytes);
  const wrapper={
    promptVaultEncryptedBackup:1,
    salt: db.security.salt,
    iterations: db.security.iterations,
    gz,
    iv: buf2b64(iv),
    ct: buf2b64(ct)
  };
  downloadJSONBackup(wrapper, 'promptvault-encrypted-'+todayStr());
  toast('Encrypted backup exported');
}

/* Applies the image half of an imported backup: v2's `images` map, plus any legacy
   inline images from a v1 backup. Replaces the store wholesale — an import is a
   restore, not a merge, matching what the metadata half already does. Protected
   prompts' images in a v1 backup are inside `enc` and migrate at the next unlock. */
async function applyImportedImages(imgMap){
  await idbClear();
  let ok=true;
  if(imgMap && typeof imgMap==='object'){
    for(const id in imgMap){ if(!await idbPut(id, imgMap[id])) ok=false; }
  }
  for(const p of db.prompts){
    if(p.nsfw || !p.image || !p.image.data) continue;
    if(!await idbPut(p.id, {enc:false, data:p.image.data, w:p.image.w, h:p.image.h})) ok=false;
    delete p.image;
  }
  delete db.images; delete db.backupVersion;   // never persist these to localStorage
  await loadImageCache();
  return ok;
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  readBackupFileAsText(f).then(text=>{
    let data;
    try{ data=JSON.parse(text); }catch(e){ toast('Not a valid backup file'); input.value=''; return; }
    if(data && data.promptVaultEncryptedBackup){
      pendingEncryptedImport=data;
      input.value='';
      openImportPinModal();
      return;
    }
    if(!Array.isArray(data.prompts)){ toast('Not a valid backup file'); input.value=''; return; }
    const imgMap=data.images||null;
    db=data; if(db.security===undefined) db.security=null; if(!Array.isArray(db.libCategories)) db.libCategories=[]; db.prompts.forEach(p=>{ if(p.categoryId===undefined) p.categoryId=null; }); if(!db.expandedCategories || typeof db.expandedCategories!=='object') db.expandedCategories={};
    sessionKey=null; decryptedCache={};
    input.value='';
    applyImportedImages(imgMap).then(imgOk=>{
      const ok=saveDB();
      render();
      if(ok && imgOk) toast('Backup imported — unlock again to view protected prompts');
      else toast('Import could not be saved — see the warning at the top');
    });
  });
}
function openImportPinModal(){
  $('#modalRoot').innerHTML=`
  <div class="scrim" onclick="if(event.target===this)cancelImportPin()">
    <div class="modal">
      <div class="mh"><h3>Enter PIN to import</h3><button class="iconbtn" onclick="cancelImportPin()">✕</button></div>
      <div class="sub" style="margin:0 0 4px">This backup is fully encrypted. Enter the PIN it was exported with.</div>
      <label class="fld">PIN</label><input id="pinimp" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')confirmImportPin()">
      <div class="foot"><button class="btn ghost" onclick="cancelImportPin()">Cancel</button><button class="btn brass" onclick="confirmImportPin()">Import</button></div>
    </div>
  </div>`;
  setTimeout(()=>$('#pinimp')&&$('#pinimp').focus(),30);
}
function cancelImportPin(){ pendingEncryptedImport=null; closeModal(); }
async function confirmImportPin(){
  const pin=$('#pinimp').value;
  const wrap=pendingEncryptedImport;
  if(!wrap) return closeModal();
  try{
    const key=await deriveKey(pin, wrap.salt, wrap.iterations);
    const iv=new Uint8Array(b642buf(wrap.iv));
    const plainBuf=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b642buf(wrap.ct));
    const bytes=new Uint8Array(plainBuf);
    const jsonText=(wrap.gz && supportsGzipStreams()) ? await gunzipBytesToText(bytes) : new TextDecoder().decode(bytes);
    const data=JSON.parse(jsonText);
    if(!Array.isArray(data.prompts)) throw new Error('unexpected shape');
    const imgMap=data.images||null;
    db=data; if(db.security===undefined) db.security=null; if(!Array.isArray(db.libCategories)) db.libCategories=[]; db.prompts.forEach(p=>{ if(p.categoryId===undefined) p.categoryId=null; }); if(!db.expandedCategories || typeof db.expandedCategories!=='object') db.expandedCategories={};
    sessionKey=key; decryptedCache={};
    const imgOk=await applyImportedImages(imgMap);
    for(const p of db.prompts){
      if(!(p.nsfw && p.enc)) continue;
      let c; try{ c=await decryptJSON(p.enc, key); }catch(e){ continue; }
      if(!(c.image && c.image.data)){
        const rec=await idbGet(p.id);
        c.image=null;
        if(rec && rec.enc && rec.blob){ try{ c.image=await decryptJSON(rec.blob, key); }catch(e){ c.image=null; } }
      }
      decryptedCache[p.id]=c;
    }
    const ok=saveDB(); pendingEncryptedImport=null;
    closeModal(); render();
    if(ok && imgOk) toast('Encrypted backup imported and unlocked');
    else toast('Import could not be saved — see the warning at the top');
  }catch(e){
    toast('Incorrect PIN, or the file is corrupted');
  }
}
async function resetAll(){
  if(confirm('Erase all prompts and PIN protection? This cannot be undone.')){
    db={version:1, dataVersion:1, security:null, prompts:[], libCategories:[], expandedCategories:{}};
    sessionKey=null; decryptedCache={}; imageCache={};
    await idbClear();
    const ok=saveDB(); render();
    if(ok) toast('All data erased');
  }
}

/* ============================ boot ============================ */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ pinAfterFn=null; closeModal(); return; }
  if(document.querySelector('.imglightbox')){
    if(e.key==='ArrowLeft'){ lightboxStep(-1); }
    else if(e.key==='ArrowRight'){ lightboxStep(1); }
  }
});
/* Boot is async now: the image store has to be open, migrated and cached before the
   first render, or every card would flash 'no image' on load. */
async function boot(){
  idb=await openImageDB();
  if(!idb) setStorageAlert('Image store unavailable — reference images cannot be loaded or saved in this browser.');
  await migrateInlineImages();
  await loadImageCache();
  render();
}
boot();
